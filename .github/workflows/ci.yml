name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do CI só lê o repositório
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes (Testcontainers sobe Postgres e Redpanda de verdade)
        run: ./mvnw -B verify
