name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do CI só lê o repositório
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # O ponta-a-ponta compra pelo Fiel de verdade (CompraPeloFielTest): o jar vem do main do repositório dele.
      # Uma mudança no Fiel que quebre o contrato com o Foil aparece aqui
      - name: Repositório do Fiel
        uses: actions/checkout@v7
        with:
          repository: Lakes777/fiel
          path: fiel-para-teste
      - name: Jar do Fiel
        working-directory: fiel-para-teste
        run: ./gradlew --no-daemon bootJar
      - name: Testes (Testcontainers sobe Postgres e Redpanda de verdade)
        run: |
          jar=$(ls fiel-para-teste/build/libs/fiel-*.jar | grep -v plain)
          ./mvnw -B verify -Dfiel.jar="$PWD/$jar"
