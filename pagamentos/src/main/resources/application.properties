spring.application.name=pagamentos
server.port=${PORTA:8093}
spring.threads.virtual.enabled=true

# Banco próprio (foil_pagamentos), com usuário próprio; na VM vem tudo do .env
spring.datasource.url=${FOIL_BANCO_URL:jdbc:postgresql://localhost:5434/foil_pagamentos}
spring.datasource.username=${FOIL_BANCO_USUARIO:}
spring.datasource.password=${FOIL_BANCO_SENHA:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.kafka.bootstrap-servers=${FOIL_KAFKA:localhost:19092}
# Cada serviço é um grupo; começa do início do tópico na primeira vez (nada se perde antes da primeira subida)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
foil.mortos.topicos=pagamentos.comandos.mortos

# Fiel (fase 5): a compra manual vira cobrança no Fiel, pela chave de integração da Loja Foil. Sem endereço ou
# chave, a forma FIEL é recusada na hora. Na VM a API é chamada por dentro da rede (fiel-api:8080); o endereço dos
# avisos é o público, porque o Fiel só entrega em https:// fora da rede interna.
foil.fiel.api=${FOIL_FIEL_API:}
foil.fiel.chave=${FOIL_FIEL_CHAVE:}
foil.fiel.site=${FOIL_FIEL_SITE:https://fiel.andrelagos.dev}
foil.fiel.webhook=${FOIL_FIEL_WEBHOOK:}
