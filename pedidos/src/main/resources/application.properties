spring.application.name=pedidos
server.port=${PORTA:8091}
spring.threads.virtual.enabled=true

# Banco próprio (foil_pedidos), com usuário próprio; na VM vem tudo do .env
spring.datasource.url=${FOIL_BANCO_URL:jdbc:postgresql://localhost:5434/foil_pedidos}
spring.datasource.username=${FOIL_BANCO_USUARIO:}
spring.datasource.password=${FOIL_BANCO_SENHA:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.kafka.bootstrap-servers=${FOIL_KAFKA:localhost:19092}
# Cada serviço é um grupo; começa do início do tópico na primeira vez (nada se perde antes da primeira subida)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
foil.mortos.topicos=estoque.eventos.mortos,pagamentos.eventos.mortos
